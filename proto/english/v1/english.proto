syntax = "proto3";
package english.v1;

option go_package = "notes-bot/proto/english/v1;englishv1";

// The English service reads material from Notes and owns review state.
service EnglishService {
  rpc SaveCard(SaveCardRequest) returns (SaveCardResponse);
  rpc ListCards(ListCardsRequest) returns (ListCardsResponse);
  rpc ListDictionaries(ListDictionariesRequest) returns (ListDictionariesResponse);
  rpc GradeCard(GradeCardRequest) returns (GradeCardResponse) {
    option deprecated = true;
  }
  rpc GetReview(GetReviewRequest) returns (GetReviewResponse);
  rpc AdvanceReview(AdvanceReviewRequest) returns (AdvanceReviewResponse);
}
message Card {
  string id = 1;
  string kind = 2; // word or phrase
  string source = 3; // Russian cue
  string english = 4;
  string explanation = 5;
  string example = 6;
  string context = 7;
  string date = 8; // Notes logical date, DD-Mmm-YYYY
  string revision = 9; // Version of the material. Review actions use ReviewPosition.token.
  int64 next_at = 10 [deprecated = true];
  int64 interval_seconds = 11 [deprecated = true];
  int32 streak = 12 [deprecated = true];
  int32 lapses = 13;
  DirectionProgress en_to_ru = 14;
  DirectionProgress ru_to_en = 15;
  string dictionary_id = 16; // Source dictionary, independent of card identity.
}
message DictionaryInfo {
  string id = 1;
  string title = 2;
  int32 card_count = 3;
}
message ListDictionariesRequest {}
message ListDictionariesResponse {
  repeated DictionaryInfo dictionaries = 1;
}
message DirectionProgress {
  string last_grade = 1;
  int64 due_round = 2;
}
message SaveCardRequest {
  string operation_id = 1;
  Card card = 2;
}
message SaveCardResponse {
  Card card = 1;
}
message ListCardsRequest {
  string kind = 1;
  bool include_progress = 2;
  string dictionary_id = 3; // Empty and "all" both select all cards.
}
message ListCardsResponse {
  repeated Card cards = 1;
  repeated DictionaryInfo dictionaries = 2;
}
message GradeCardRequest {
  string id = 1;
  string revision = 2;
  string grade = 3; // miss, hard, easy
}
message GradeCardResponse {
  Card card = 1;
}

message ReviewPosition {
  Card card = 1; // Absent when the dictionary is empty.
  string token = 2; // Version of this specific presentation, including material.
  int64 round = 3;
  int32 position = 4; // One-based position in the current round.
  int32 round_size = 5;
  int32 easy_level = 6; // 0 through 5 for the current card.
  string prompt_language = 8; // en or ru, fixed for this presentation.
  string dictionary_id = 9; // Review queue, which can differ from the card's source.
  Card next_preview = 7; // Read-only lookahead within this round, without an action token.
}
message GetReviewRequest {
  bool include_remaining = 1;
  string dictionary_id = 2;
}
message GetReviewResponse {
  ReviewPosition current = 1;
  repeated ReviewPosition remaining = 2; // Includes current through the end of this round.
  repeated DictionaryInfo dictionaries = 3; // Populated with the round pack.
}
enum ReviewAction {
  REVIEW_ACTION_UNSPECIFIED = 0;
  REVIEW_ACTION_MISS = 1;
  REVIEW_ACTION_HARD = 2;
  REVIEW_ACTION_EASY = 3;
  REVIEW_ACTION_SKIP = 4;
}
message AdvanceReviewRequest {
  string token = 1;
  ReviewAction action = 2;
  string dictionary_id = 3;
}
message AdvanceReviewResponse {
  ReviewPosition current = 1;
  int32 skipped_rounds = 2; // Number of full rounds skipped by this grade.
}

// Hosted by the existing remote search/model worker; no retrieval or vault input.
service TutorService {
  rpc Prepare(PrepareRequest) returns (PrepareResponse);
}
message PrepareRequest {
  string kind = 1;
  string input = 2;
  string instruction = 3;
  Card previous = 4;
}
message PrepareResponse {
  Card card = 1;
  string question = 2;
}
