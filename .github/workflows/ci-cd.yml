name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for buf breaking against main

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      # Cache prebuilt dev tools (buf, protoc-gen-*, templ) and buf's own
      # module cache so `make install` and `buf` don't recompile/download
      # from scratch on every run. Include both canonical version sources.
      - name: Cache installed tools
        uses: actions/cache@v4
        with:
          path: |
            ~/go/bin
            ~/.cache/buf
          key: tools-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum', 'Makefile', 'makefiles/versions.mk') }}
          restore-keys: |
            tools-${{ runner.os }}-

      - name: Install tools
        run: make install

      - name: Check generated contracts, formatting, code and tests
        run: make check
        env:
          PROTO_BREAKING_AGAINST: .git#ref=${{ github.event.pull_request.base.sha || github.event.before }},subdir=proto

      - name: Install golangci-lint
        run: make install-golangci-lint

      - name: Lint (golangci-lint)
        run: make lint-golangci

      - name: Start isolated voice job database
        run: make test-voice-db-up

      - name: Verify durable voice storage with real PostgreSQL
        run: make test-voice-db
        env:
          TEST_VOICE_DATABASE_URL: postgres://voicejobs_test:synthetic-voicejobs-test@127.0.0.1:55442/voicejobs_test?sslmode=disable

      - name: Stop isolated voice job database
        if: always()
        run: make test-voice-db-down


  images:
    name: Build and publish application images
    needs: [test]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      manifest: ${{ steps.publish.outputs.manifest }}
    env:
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Build images without runtime secrets
        run: make image-check image-build
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the images built above
        id: publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: make image-publish
      - name: Save digest manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: image-release
          path: .images/release.json
          include-hidden-files: true
          retention-days: 30

  deploy:
    name: Deploy published digests to VM
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy checked revision and published images
        uses: appleboy/ssh-action@v1.2.2
        env:
          PROJECT_PATH: ${{ secrets.VM_PROJECT_PATH }}
          DEPLOY_SHA: ${{ github.sha }}
          IMAGE_MANIFEST_B64: ${{ needs.images.outputs.manifest }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: PROJECT_PATH,DEPLOY_SHA,IMAGE_MANIFEST_B64,GHCR_USER,GHCR_TOKEN
          command_timeout: 35m
          script: |
            set -eu
            cd "${PROJECT_PATH:?}"
            test "$(git rev-parse --show-toplevel)" = "$(pwd -P)"
            git fetch --quiet origin refs/heads/main
            git show "$DEPLOY_SHA:makefiles/ci-deploy.mk" | make -f - ci-deploy
