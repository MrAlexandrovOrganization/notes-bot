name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for buf breaking against main

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Install tools
        run: make install

      - name: Lint proto
        run: make proto-lint

      - name: Check proto breaking changes
        run: buf breaking proto --against "https://github.com/${{ github.repository }}.git#branch=main,subdir=proto" || true # TODO: remove `|| true` after the first run on main

      - name: Generate proto stubs
        run: buf generate

      - name: Generate templ views
        run: make templ

      - name: Lint (gofmt + vet)
        run: make lint

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v9
        with:
          # Pin to a v2 release built with Go >= 1.26; v1.x fails with
          # "Go language version used to build golangci-lint is lower than
          # the targeted Go version".
          version: v2.4.0
          args: ./...

      - name: Test (race + coverage)
        run: make test

      - name: Integration tests
        run: make test-integration-ci

      - name: Build Docker images
        run: docker compose build

  deploy:
    name: Deploy to VM
    needs: test
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2 # pin minor; move to SHA when possible
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ${{ secrets.VM_PROJECT_PATH }}
            git pull
            make up
