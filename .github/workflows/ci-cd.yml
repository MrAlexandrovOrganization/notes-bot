name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for buf breaking against main

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      # Cache prebuilt dev tools (buf, protoc-gen-*, templ) and buf's own
      # module cache so `make install` and `buf` don't recompile/download
      # from scratch on every run. Keyed on go.sum + Makefile so a tool
      # version bump (Makefile) busts the cache instead of serving stale bins.
      - name: Cache installed tools
        uses: actions/cache@v4
        with:
          path: |
            ~/go/bin
            ~/.cache/buf
          key: tools-${{ runner.os }}-${{ hashFiles('go.sum', 'Makefile') }}
          restore-keys: |
            tools-${{ runner.os }}-

      - name: Install tools
        run: make install

      - name: Lint proto
        run: make proto-lint

      - name: Check proto breaking changes
        run: buf breaking proto --against "https://github.com/${{ github.repository }}.git#branch=main,subdir=proto"

      - name: Generate proto stubs
        run: buf generate

      - name: Generate templ views
        run: make templ

      - name: Lint (gofmt + vet)
        run: make lint

      - name: Lint (golangci-lint)
        uses: golangci/golangci-lint-action@v9
        with:
          # Pin a v2 release built with Go >= our go.mod directive.
          # golangci-lint refuses to lint modules targeting a newer Go than
          # it was built with, so both sides must stay in sync.
          version: v2.13.1
          args: ./...

      - name: Test (race + coverage)
        run: make test

      - name: Integration tests
        run: make test-integration-ci

  build:
    name: Build Docker images
    runs-on: ubuntu-24.04
    # Runs in parallel with the `test` job: docker builds are self-contained
    # (they generate proto/templ inside the Dockerfile), so they don't depend
    # on the host-side checks. Overlaps the long image build with test/lint.
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker images
        run: docker compose build
        env:
          # Placeholders: compose interpolates these while parsing the file
          # (e.g. "${NOTES_DIR}:/notes" volume specs), but building images
          # requires no real secrets or paths.
          NOTES_DIR: /tmp/notes
          DB_PASSWORD: ci-placeholder
          SEARCH_DB_PASSWORD: ci-placeholder

  deploy:
    name: Deploy to VM
    needs: [test, build]
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2 # pin minor; move to SHA when possible
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ${{ secrets.VM_PROJECT_PATH }}
            git pull
            make up
