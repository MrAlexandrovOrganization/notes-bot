# Russia runs the notes application and vault; shared infrastructure has
# independent tailnet endpoints. Kafka advertises kafka:9092, so both clients
# must map the broker hostname to the WSL endpoint.
networks:
  default:
    ipam:
      config:
        - subnet: ${NOTES_SUBNET:?Set a non-overlapping private subnet}
services:
  postgres:
    image: ${NOTES_POSTGRES_IMAGE:?Set the migrated PostgreSQL image digest}
  postgres-search:
    image: ${NOTES_SEARCH_POSTGRES_IMAGE:?Set the migrated pgvector image digest}
  english-reporting:
    image: haproxy:${HAPROXY_VERSION:?Run via make}
    container_name: ${CONTAINER_NAME_PREFIX:-}notes-bot-english-reporting
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      postgres-english:
        condition: service_healthy
    ports:
      - "100.64.0.5:15435:5432"
    volumes:
      - ./ops/english/reporting.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8404/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5
    extends:
      file: compose/docker-compose.base.yml
      service: base
  core:
    # The sync client must be able to read files created by the note writer.
    user: "${NOTES_VAULT_UID:?}:${NOTES_VAULT_GID:?}"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${NOTES_OTLP_ENDPOINT:?Set the existing trace collector}
  notifications:
    networks: !override [default, prometheus-net, jaeger-net]
    extra_hosts:
      - "kafka=${NOTES_KAFKA_HOST:?Set the Kafka tailnet address}"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${NOTES_OTLP_ENDPOINT:?Set the existing trace collector}
  search:
    user: "${NOTES_VAULT_UID:?}:${NOTES_VAULT_GID:?}"
    networks: !override [default, prometheus-net, jaeger-net]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${NOTES_OTLP_ENDPOINT:?Set the existing trace collector}
  web:
    networks: !override [default, caddy-net, whisper-net, prometheus-net, jaeger-net]
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${NOTES_OTLP_ENDPOINT:?Set the existing trace collector}
  telegram:
    networks: !override [default, caddy-net, whisper-net, prometheus-net, jaeger-net, telegram-net]
    extra_hosts:
      - "kafka=${NOTES_KAFKA_HOST:?Set the Kafka tailnet address}"
    environment:
      NOTES_MINI_APP_URL: ${NOTES_MINI_APP_URL-https://notes.mralexandrov.duckdns.org/mini}
      REDIS_HOST: ${NOTES_REDIS_HOST:?Set the Redis tailnet address}
      REDIS_PORT: ${NOTES_REDIS_PORT:?Set the private Redis forwarder port}
      LOCATION_HOST: ${NOTES_LOCATION_HOST:?Set the location tailnet address}
      LOCATION_PORT: ${NOTES_LOCATION_PORT:?Set the private location forwarder port}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${NOTES_OTLP_ENDPOINT:?Set the existing trace collector}
      # The local Bot API performs Telegram egress. Do not use server's host proxy.
      HTTPS_PROXY: ""
      HTTP_PROXY: ""
      ALL_PROXY: ""
      NO_PROXY: "*"
