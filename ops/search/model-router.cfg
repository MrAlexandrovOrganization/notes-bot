global
  nbthread 1
  maxconn 32
  log stdout format raw local0 warning

defaults
  mode http
  timeout connect 2s
  timeout client 6m
  timeout server 6m
  retries 0
  option abortonclose

resolvers docker
  nameserver docker 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 10s

frontend model_api
  bind :11434
  http-request deny unless { path /api/embed /api/chat }
  use_backend embeddings if { path /api/embed }
  default_backend generation

backend embeddings
  server embed "${SEARCH_EMBEDDING_ADDRESS}" resolvers docker resolve-prefer ipv4 init-addr libc,none check inter 5s

backend generation
  http-request set-header Host "${SEARCH_GENERATION_HTTP_HOST}"
  server chat "${SEARCH_GENERATION_ADDRESS}" resolvers docker resolve-prefer ipv4 init-addr libc,none check inter 5s

frontend health
  bind :8404
  monitor-uri /health
