global
  log stdout format raw local0 warning
  maxconn 256

defaults
  mode tcp
  timeout connect 2s
  timeout check 1s
  timeout client 6m
  timeout server 6m
  retries 0

frontend search_api
  bind :50054
  default_backend search_worker

backend search_worker
  server worker "${SEARCH_WORKER_ADDRESS}:50054" check inter 2s fall 2 rise 1 on-marked-down shutdown-sessions

frontend search_metrics
  bind :9103
  default_backend worker_metrics

backend worker_metrics
  server worker "${SEARCH_WORKER_ADDRESS}:9103" check port 50054 inter 2s fall 2 rise 1 on-marked-down shutdown-sessions

frontend health
  bind :8404
  mode http
  monitor-uri /health
  http-request use-service prometheus-exporter if { path /metrics }
