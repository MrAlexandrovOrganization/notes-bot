global
  maxconn 12

defaults
  mode tcp
  timeout connect 3s
  timeout client 90s
  timeout server 90s

resolvers docker
  nameserver dns 127.0.0.11:53
  hold valid 5s

frontend reporting
  bind :5432
  tcp-request connection reject unless { src 100.64.0.10/32 }
  default_backend english_postgres

backend english_postgres
  server db postgres-english:5432 check resolvers docker init-addr libc,none

frontend health
  bind 127.0.0.1:8404
  mode http
  monitor-uri /health
  monitor fail if { nbsrv(english_postgres) eq 0 }
