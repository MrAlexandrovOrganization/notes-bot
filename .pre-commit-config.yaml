# Pre-commit hooks configuration
# See https://pre-commit.com for more information

repos:
  - repo: local
    hooks:
      - id: make-format
        name: Run make format
        entry: make format
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: make-lint
        name: Run make lint (gofmt + go vet)
        entry: make lint
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: gitleaks
        name: Detect secrets (gitleaks)
        entry: gitleaks protect --staged --redact
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: no-large-files
        name: Check for large files (>500KB)
        entry: bash -c 'if files=$(find . -type f -size +500k -not -path "./.git/*" -not -path "./third_party/*" -not -name "*.pb.go" -not -name "*_grpc.pb.go"); [ -n "$files" ]; then echo "$files"; exit 1; fi'
        language: system
        pass_filenames: false
        stages: [pre-commit]
